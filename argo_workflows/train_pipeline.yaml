metadata:
  name: data-prep-training-pipeline
  namespace: projet-bdc-data

spec:
  parallelism: 5
  entrypoint: pipeline

  templates:

  # ─────────────────────── ENTRYPOINT ────────────────────────────
  - name: pipeline
    dag:
      tasks:
        # Data preparation (all 3 in parallel)
        - name: prepare-data-no-enc-no-norm
          template: prepare-data
          arguments:
            parameters:
              - name: script
                value: "src/data_processing/prepare_data_no_enc_no_norm.py"

        - name: prepare-data-enc-no-norm
          template: prepare-data
          arguments:
            parameters:
              - name: script
                value: "src/data_processing/prepare_data_enc_no_norm.py"

        - name: prepare-data-enc-norm
          template: prepare-data
          arguments:
            parameters:
              - name: script
                value: "src/data_processing/prepare_data_enc_norm.py"

        # Boosting models (enc_no_norm)
        - name: train-xgboost
          dependencies: [prepare-data-enc-no-norm]
          template: train
          arguments:
            parameters:
              - name: script
                value: "src/models/train_xgboost.py"

        - name: train-lightgbm
          dependencies: [prepare-data-enc-no-norm]
          template: train
          arguments:
            parameters:
              - name: script
                value: "src/models/train_lightgbm.py"

        - name: train-histgb
          dependencies: [prepare-data-enc-no-norm]
          template: train
          arguments:
            parameters:
              - name: script
                value: "src/models/train_histgb.py"

        # CatBoost (no_enc_no_norm)
        - name: train-catboost
          dependencies: [prepare-data-no-enc-no-norm]
          template: train
          arguments:
            parameters:
              - name: script
                value: "src/models/train_catboost.py"

        # Logistic Regression (enc_norm)
        - name: train-logistic-regression
          dependencies: [prepare-data-enc-norm]
          template: train
          arguments:
            parameters:
              - name: script
                value: "src/models/train_logistic_regression.py"

  # ─────────────────────── DATA PREP TEMPLATE ────────────────────
  - name: prepare-data
    inputs:
      parameters:
        - name: script
    container:
      image: kellybrbn/bdc-alptis:data_preparation
      imagePullPolicy: Always
      command: ["uv", "run", "python"]
      args: ["{{inputs.parameters.script}}"]
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_SESSION_TOKEN
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: MLFLOW_TRACKING_PASSWORD
            
        - name: AWS_S3_ENDPOINT
          value: "https://minio-simple.lab.groupe-genes.fr"
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "https://minio-simple.lab.groupe-genes.fr"
        - name: MLFLOW_TRACKING_INSECURE_TLS
          value: "true"
        - name: MLFLOW_S3_IGNORE_TLS
          value: "true"
        - name: MLFLOW_TRACKING_USERNAME
          value: "projet-bdc-data"
        - name: MLFLOW_TRACKING_URI
          value: "https://projet-bdc-data-mlflow.lab.groupe-genes.fr"
      
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "4Gi"
          cpu: "2"

  # ─────────────────────── TRAINING TEMPLATE ─────────────────────
  - name: train
    inputs:
      parameters:
        - name: script
    container:
      image: kellybrbn/bdc-alptis:training
      imagePullPolicy: Always
      command: ["uv", "run", "python"]
      args: ["{{inputs.parameters.script}}"]
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: AWS_SESSION_TOKEN
        - name: AWS_S3_ENDPOINT
          value: "minio-simple.lab.groupe-genes.fr"
        - name: MLFLOW_TRACKING_URI
          value: "https://projet-bdc-data-mlflow.lab.groupe-genes.fr"
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "https://minio-simple.lab.groupe-genes.fr"
        - name: MLFLOW_TRACKING_INSECURE_TLS
          value: "true"
        - name: MLFLOW_S3_IGNORE_TLS
          value: "true"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"