name: Build and push images for data_prep and training to DockerHub

on:
  push:
    branches:
      - main

jobs:

  build-push-data-preparation:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build data prep image
        run: |
          docker build \
            -f docker/Dockerfile.data_preparation \
            -t kellybrbn/bdc-alptis:data_preparation .

      - name: Push data prep image
        run: |
          docker push kellybrbn/bdc-alptis:data_preparation


  build-push-training:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build training image
        run: |
          docker build \
            -f docker/Dockerfile.training \
            -t kellybrbn/bdc-alptis:training .

      - name: Push training image
        run: |
          docker push kellybrbn/bdc-alptis:training